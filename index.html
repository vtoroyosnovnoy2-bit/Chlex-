
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой планер</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

    <header class="status">
        <span>9:41</span>
        <div class="island"></div>
        <span>▮▮▮ ◉ ▰</span>
    </header>

    <main>

        <!-- СОБЫТИЯ -->
        <section class="page active" id="events">

            <div class="calendar">
                <div class="month">
                    <b>Январь 2027</b>
                    <span>28-3</span>
                </div>

                <div class="weekdays">
                    <span>Пн</span><span>Вт</span>
                    <span>Ср</span><span>Чт</span>
                    <span>Пт</span><span>Сб</span>
                    <span>Вс</span>
                </div>

                <div class="dates">
                    <button class="muted">28</button>
                    <button class="muted">29</button>
                    <button class="muted">30</button>
                    <button class="muted">31</button>
                    <button class="selected">1</button>
                    <button>2</button>
                    <button>3</button>
                </div>
            </div>

            <div class="events-panel">

                <h3>Мои события</h3>

                <div class="week-checks">
                    <span>▧</span>
                    <span>✓</span><span>✓</span>
                    <span>✓</span><span>✓</span>
                    <span>✓</span><span>✓</span>
                    <span>✓</span>
                </div>

                <div class="event-list">

                    <div class="event running">
                        <div class="event-icon">🏃</div>
                        <div class="event-info">
                            <div>Бег</div>
                            <span>8:00 -10:00</span>
                        </div>
                        <button class="pause" id="pause">Ⅱ</button>
                        <div class="progress"><span></span></div>
                    </div>

                    <div class="event">
                        <div class="event-icon">📕</div>
                        <div class="event-info">
                            <div>Читать</div>
                            <span>7:00 -7:45</span>
                        </div>
                        <button class="check">✓</button>
                    </div>

                    <div class="event">
                        <div class="event-icon">🏊</div>
                        <div class="event-info">
                            <div>Бассейн</div>
                            <span>6:00 -6:45</span>
                        </div>
                        <button class="check">✓</button>
                    </div>

                    <div class="event">
                        <div class="event-icon">🎞</div>
                        <div class="event-info">
                            <div>Кино</div>
                            <span>5:00 -5:45</span>
                        </div>
                        <button class="check">✓</button>
                    </div>

                    <div class="event">
                        <div class="event-icon">📖</div>
                        <div class="event-info">
                            <div>Учеба</div>
                            <span>7:00 -7:45</span>
                        </div>
                        <button class="check">✓</button>
                    </div>

                    <div class="event">
                        <div class="event-icon">🏃</div>
                        <div class="event-info">
                            <div>Тренировка</div>
                            <span>8:00 -9:00</span>
                        </div>
                        <button class="check">✓</button>
                    </div>

                </div>
            </div>
        </section>

        <!-- СПОРТ -->
        <section class="page" id="sport">
            <div class="sport-block"></div>
            <div class="sport-block"></div>
        </section>

        <!-- ПИТАНИЕ -->
        <section class="page" id="food"></section>

        <!-- НАСТРОЙКИ -->
        <section class="page" id="settings"></section>

    </main>

    <!-- НИЖНЕЕ МЕНЮ -->
    <nav class="bottom-nav">

        <button data-page="food">
            <span class="nav-icon">♧</span>
            <span>Питание</span>
        </button>

        <button data-page="sport">
            <span class="nav-icon">⚐</span>
            <span>Спорт</span>
        </button>

        <button data-page="events" class="active">
            <span class="nav-icon">▢</span>
            <span>События</span>
        </button>

        <button data-page="settings">
            <span class="nav-icon">⚙</span>
            <span>Настройки</span>
        </button>

    </nav>

    <div class="home-indicator"></div>

</div>

<script>
    // Переключение вкладок
    const buttons = document.querySelectorAll('.bottom-nav button');
    const pages = document.querySelectorAll('.page');

    buttons.forEach(button => {
        button.addEventListener('click', () => {

            const target = button.dataset.page;

            pages.forEach(page => {
                page.classList.toggle(
                    'active',
                    page.id === target
                );
                if (page.id === target) {
                    page.scrollTop = 0;
                }
            });

            buttons.forEach(item => {
                item.classList.toggle('active', item === button);
            });

        });
    });

    // Выбор даты
    document.querySelectorAll('.dates button').forEach(date => {
        date.addEventListener('click', () => {
            document.querySelectorAll('.dates button')
                .forEach(item => item.classList.remove('selected'));

            date.classList.add('selected');
        });
    });

    // Отметки событий
    document.querySelectorAll('.check').forEach(button => {
        button.addEventListener('click', () => {
            button.classList.toggle('unchecked');
            button.textContent =
                button.classList.contains('unchecked') ? '○' : '✓';
        });
    });

    // Пауза бега
    document.getElementById('pause').addEventListener('click', function() {
        this.classList.toggle('paused');
        this.textContent = this.classList.contains('paused') ? '▶' : 'Ⅱ';
    });
</script>

</body>
</html>
